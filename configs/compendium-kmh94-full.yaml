# The published compendium tabulation for Kim, Martin & Hendry (1994) R_V = 3.1 grains, full scattering.
#
# Reproduces the configuration of the original runModels.pl: an exponential disk
# with a sech^2 vertical structure, dust following the same distribution, and a
# Hernquist stellar spheroid tabulated over 51 sizes.
#
# Lengths are in units of the disk scale length. The original used a physical
# disk scale radius of 1e-3 Mpc and noted the results do not depend on it.
#
# The vertical scale height is from Kregel, van der Kruit & de Grijs (2002;
# MNRAS; 334; 646).
label: compendium:exp:sech:Hernquist:hd0.137:hz0.137:dustKMH94FullRv3.1
description: >-
  Exponential disk with sech^2 vertical structure and a Hernquist spheroid,
  with Kim, Martin & Hendry (1994) R_V = 3.1 grains, full scattering.

dust:
  file: hyperion-dust-0.1.0/dust_files/kmh94_3.1_full.hdf5
  description: >-
    Kim, Martin & Hendry (1994; ApJ; 422; 164) with R_V=3.1 and a full scattering calculation

geometry:
  cutOff: 10.0
  radialCells: 100
  verticalCells: 100
  # Not the original's `published` and `centre`, deliberately.
  #
  # Those cannot resolve a thin disk inside a large spheroid. On this grid, with
  # a cut off of ten and a hundred cells, the disk dust actually present falls to
  # 21% of what it should be by a spheroid scale radius of 3, and to nothing by
  # 31.6 -- and twenty of the fifty-one radii below are above 1. The published
  # tabulations therefore report almost no attenuation of spheroid light at their
  # large radii, as an artefact rather than as physics.
  #
  # `nested` spaces the vertical walls to resolve the smallest scale as well as
  # reach the largest, and `average` gives each cell the density that puts the
  # profile's true mass in it. Together they hold the requested optical depth at
  # every spheroid size here.
  spacing: nested
  sampling: average
  components:
    disk:
      stellar:
        profile: exponentialDisk
        verticalStructure: sechSquared
        scaleRadial: 1.0
        scaleHeight: 0.137
      dust:
        profile: exponentialDisk
        verticalStructure: sechSquared
        scaleRadial: 1.0
        scaleHeight: 0.137
        # Sixty points plus a zero, where the published tabulation has
        # fifty-nine plus a zero: the original's `count` of 60 included the zero
        # it appended afterwards, which was read here as sixty positive points.
        # The axes therefore do not coincide, which costs nothing -- Galacticus
        # reads the axis from the file, and sixty points over six decades
        # samples marginally better -- but it is not a byte-for-byte axis match.
        # Left as it stands so that all five grain models share one axis.
        opticalDepth:
          minimum: 0.01
          maximum: 1.0e4
          count: 60
          includeZero: true
    spheroid:
      stellar:
        profile: hernquist
        scaleRadial:
          minimum: 1.0e-3
          maximum: 1.0e2
          count: 51
        # The original parsed a spheroid cut off of 10 and then never applied
        # it; setting it here truncates the profile as was intended.
        truncation: 10.0

tabulation:
  wavelengths: {minimum: 0.01, maximum: 3.0, count: 250}
  # Twenty-three points spaced uniformly in the cosine of the inclination,
  # rather than the original's forty-six spaced uniformly in the angle. Measured
  # on a disk at optical depths of 1, 10 and 100, this interpolates as accurately
  # as the forty-six did -- worst error 0.0034 in transmission against a Monte
  # Carlo noise floor of 0.004 -- while halving the cost, which is very nearly
  # linear in the number of peel-off directions. It is also the grid randomly
  # oriented galaxies are uniform on.
  inclinations: {minimum: 0.0, maximum: 90.0, count: 23, spacing: cosine}
  photons: 100000
  seed: -653
